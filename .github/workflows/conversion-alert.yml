name: Conversion alert (Telegram)

# Runs every hour (free on GitHub Actions) and pings the site, which checks
# "checkout ho raha hai par order nahi" and sends a Telegram message if needed.
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://www.sutisaree.com   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel (if you set one)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call conversion-alert endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL secret missing"; exit 1; fi
          curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/conversion-alert"
